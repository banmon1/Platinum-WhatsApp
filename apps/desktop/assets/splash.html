<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platinum WhatsApp</title>
  <link rel="preload" href="platinum-rounded.png" as="image" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: #F5FF32; font-family: Arial, sans-serif; }
    .halo { width: 270px; height: 270px; display: grid; place-items: center; border-radius: 76px; transform: scale(.93); opacity: .88; }
    html.ready .halo { animation: pulse 1.05s ease-in-out infinite; }
    img { width: 230px; height: 230px; object-fit: contain; filter: drop-shadow(0 24px 35px rgba(31,38,36,.22)); }
    .label { position: fixed; bottom: 28px; color: #1F2624; font-size: 11px; font-weight: 700; letter-spacing: 2.4px; }
    @keyframes pulse { 0%,100% { transform: scale(.93); opacity: .78; } 50% { transform: scale(1.04); opacity: 1; } }
  </style>
</head>
<body>
  <div class="halo"><img id="splash-logo" src="platinum-rounded.png" alt="Platinum WhatsApp" decoding="sync" fetchpriority="high"></div>
  <div class="label">PLATINUM WHATSAPP</div>
</body>
</html>
